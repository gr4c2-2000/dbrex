# A disposable copy of the world dbrex runs in.
#
# The point is the first five minutes: a machine that has never seen this
# project installs it, starts a daemon it has to seed itself, and queries real
# engines. Unit tests cannot fail the way a fresh install fails.
#
# Every service is throwaway. There are no volumes on purpose: a run that
# depends on what the previous run left behind is not testing an installation.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: analytics
      MYSQL_USER: dbrex
      MYSQL_PASSWORD: dbrexpw
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 3s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: rootpw
      POSTGRES_DB: analytics
      POSTGRES_USER: dbrex
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dbrex", "-d", "analytics"]
      interval: 3s
      timeout: 5s
      retries: 30

  # RisingWave shares the postgres provider, and this is where that claim is
  # checked rather than assumed. Behind a profile because the image is 11 GB:
  # `make verify` must stay something a new contributor can afford to run.
  #
  #   make verify-risingwave
  #
  # It seeds itself through dbrex, since the image ships no psql.
  risingwave:
    image: risingwavelabs/risingwave:latest
    profiles: [risingwave]
    command: single_node
    healthcheck:
      # No psql and no curl in the image; the frontend port answering is the
      # only signal available from inside it.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Developer edition, which is the licence this image defaults to and is free
  # for non-production use. 2 GB of RAM is the documented floor.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: dbrexPw1!
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40

  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: dbrexPw1!
    volumes:
      - ./seed/mssql.sh:/seed.sh:ro
    entrypoint: ["bash", "/seed.sh"]
    # The seed talks to the other container, so its own hostname is not localhost.
    network_mode: service:mssql

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: dbrex
      CLICKHOUSE_PASSWORD: dbrexpw
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./seed/clickhouse.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "dbrex", "--password", "dbrexpw", "-q", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Redpanda rather than Kafka proper: one container, no ZooKeeper, no KRaft
  # ceremony, and the same wire protocol. What is being tested is our reader.
  kafka:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Topics and messages, one topic per compression codec. KafkaJS implements
  # none of snappy, lz4 or zstd, so a reader without its own codecs lists these
  # topics and then fails on every message in them — which is the bug this seed
  # exists to catch.
  kafka-seed:
    image: redpandadata/redpanda:latest
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: >
      bash -c "
      export RPK_BROKERS=kafka:9092 &&
      rpk topic create events -p 3 &&
      rpk topic create empty-topic &&
      for i in $$(seq 1 300); do
        echo '{\"day\":\"2026-09-16\",\"kind\":\"click\",\"hits\":'$$i',\"note\":null}';
      done | rpk topic produce events --compression snappy --format '%v\n' &&
      for codec in none gzip snappy lz4 zstd; do
        rpk topic create c-$$codec &&
        printf '{\"hits\":1}\n{\"hits\":2}\n' | rpk topic produce c-$$codec --compression $$codec --format '%v\n';
      done &&
      printf 'not json at all\n' | rpk topic produce events --format '%v\n'
      "

  # Security off on purpose. This verifies the SQL and Query DSL surfaces, not
  # Elastic's TLS bootstrap, and a single-node cluster with certificates to
  # distribute would add a step that fails for reasons unrelated to dbrex.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  elasticsearch-seed:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    depends_on:
      elasticsearch: { condition: service_healthy }
    volumes:
      - ./seed/elasticsearch.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: dbrexkey
      MINIO_ROOT_PASSWORD: dbrexsecret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Creates the bucket and puts one object in it, then exits. The runner waits
  # for this to finish rather than for minio alone, so a browse test never races
  # an empty bucket.
  minio-seed:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 dbrexkey dbrexsecret &&
      mc mb --ignore-existing local/analytics &&
      echo 'day,hits' > /tmp/events.csv &&
      echo '2026-09-16,42' >> /tmp/events.csv &&
      mc cp /tmp/events.csv local/analytics/events/events.csv
      "

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql: { condition: service_healthy }
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio-seed: { condition: service_completed_successfully }
      elasticsearch-seed: { condition: service_completed_successfully }
      mssql-seed: { condition: service_completed_successfully }
      kafka-seed: { condition: service_completed_successfully }
    environment:
      # How the connections file reaches its passwords without a vault prompt.
      MYSQL_PASSWORD: dbrexpw
      MSSQL_PASSWORD: dbrexPw1!
      POSTGRES_PASSWORD: rootpw
      CLICKHOUSE_PASSWORD: dbrexpw
      S3_SECRET: dbrexsecret
      # A home of its own, so the run cannot read a developer's real ~/.dbrex.
      DBREX_HOME: /home/dbrex/.dbrex
    volumes:
      # Read-only: the verification copies the tree and builds the copy, so a
      # run can never write into the working checkout.
      - ../..:/src:ro
    command: ["/opt/dbrex/verify.sh"]

  # The runner again, with RisingWave up and only its checks to run. Separate
  # service rather than a flag on `runner` so the 11 GB image is pulled by
  # whoever asked for it and by nobody else.
  risingwave-runner:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [risingwave]
    depends_on:
      risingwave: { condition: service_healthy }
    environment:
      MYSQL_PASSWORD: dbrexpw
      MSSQL_PASSWORD: dbrexPw1!
      POSTGRES_PASSWORD: rootpw
      CLICKHOUSE_PASSWORD: dbrexpw
      S3_SECRET: dbrexsecret
      DBREX_HOME: /home/dbrex/.dbrex
    volumes:
      - ../..:/src:ro
    command: ["/opt/dbrex/verify-risingwave.sh"]

  # The same world, entered by someone who has nothing yet: no build, no
  # node_modules, no dbrex on PATH. Separate from `runner` because a working
  # build is no evidence that an installation works.
  installer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_PASSWORD: dbrexpw
      MSSQL_PASSWORD: dbrexPw1!
      POSTGRES_PASSWORD: rootpw
      CLICKHOUSE_PASSWORD: dbrexpw
      S3_SECRET: dbrexsecret
      DBREX_HOME: /home/dbrex/.dbrex
    volumes:
      - ../..:/src:ro
    command: ["/opt/dbrex/verify-install.sh"]
